const W=1920,H=1080,DUR=15,ACC='#2563EB',INK='#0F172A',MUT='#64748B',ACC2='#60A5FA';
const cv=document.getElementById('cv'),c=cv.getContext('2d');
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const pr=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,x)=>a+(b-a)*x;
const win=(t,a,b,fi,fo)=>Math.min(pr(t,a,a+fi),1-pr(t,b-fo,b));
const rnd=(i,n)=>{const v=Math.sin(i*127.1+n*311.7)*43758.5453;return v-Math.floor(v)};

/* ---------- drawing helpers ---------- */
function T(s,x,y,sz,w,col,al='left',a=1,ls=0){

let ac,master,dest,noiseBuf;
function initAudio(){
  if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=.5;dest=ac.createMediaStreamDestination();
  master.connect(ac.destination);master.connect(dest);
  noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function env(g,t0,a,d,v){g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+a);g.gain.exponentialRampToValueAtTime(.0001,t0+a+d)}
function osc(type,f0,f1,t0,dur,v,a=.004){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t0);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,t0+dur);env(g,t0,a,dur,v);
  o.connect(g).connect(master);o.start(t0);o.stop(t0+a+dur+.05);
}
function nz(t0,type,f0,f1,dur,v,a){
  const s=ac.createBufferSource();s.buffer=noiseBuf;const f=ac.createBiquadFilter();f.type=type;f.Q.value=.8;
  f.frequency.setValueAtTime(f0,t0);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  const g=ac.createGain();env(g,t0,a,dur,v);s.connect(f).connect(g).connect(master);s.start(t0);s.stop(t0+a+dur+.05);
}

for(let b=0;b<25;b++){const bt=2+b*.5;ev(bt,at=>kick(at));ev(bt+.25,at=>hat(at));if(b%2==0)ev(bt,at=>bass(at,[55,55,65.4,49][(b/2)%4|0]))}

  initAudio();if(rec)return;

function startRec(){
  initAudio();
  const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  const vs=cv.captureStream(60);dest.stream.getAudioTracks().forEach(k=>vs.addTrack(k));
  const o={videoBitsPerSecond:12e6};if(mime)o.mimeType=mime;
  rec=new MediaRecorder(vs,o);chunks=[];
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));
    a.download='reel.webm';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),8000);rec=null;ui();

}

  else if(e.code==='KeyR'){rec?stopRec():startRec()}
});
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();

let last=performance.now();
function loop(n){
  const dt=Math.min(.1,(n-last)/1000);last=n;
  if(playing){t+=dt;if(t>=DUR){t=DUR;playing=false;if(rec)setTimeout(stopRec,600);ui()}}
  render(t);requestAnimationFrame(loop);
}
ui();requestAnimationFrame(loop);
</script>
</body>
</html>
